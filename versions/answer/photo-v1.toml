description = "Qwen3-VL 8B answers from the photo, the top 2 figures as images and the top 3 with their report text, citing each fact"
impl = "vlm"
# The figure index whose report text and figure images the answer cites
index = "../failure/indexes/dinov2-base-v1.json"

# The evidence: the closest 3 figures with their captions and citing paragraphs, each paragraph
# cut to 700 characters, and their reports' closing paragraphs; the first 2 figures as images too
figures = 3
images = 2
figure_side = 768
photo_side = 1024
paragraph_chars = 700

# One call to the model the reader and the router use; no describe step before it
model = "mlx-community/Qwen3-VL-8B-Instruct-4bit"
max_tokens = 500
prompt = """
You are a failure-analysis assistant for aircraft parts. The first image is the user's photo of a part. The next images are figures from NTSB materials laboratory reports, reference image 1 and then reference image 2, as the evidence lists them. They were found because they look most like the photo.
Answer only from the evidence. Do not describe the photo at length, and add no fact the evidence does not give.
- match: true when the photo shows the same kind of part as reference image 1 or reference image 2. A figure listed without an image is context only. A figure whose failure mode is reference_no_defect shows an intact part, an exemplar or a mechanism working as it should: then the answer is what the report found about that part. Set match to false only when the photo clearly shows a different kind of part from both reference images.
- what_is_wrong: one or two sentences that answer the question; never empty.
- findings: facts from the evidence, each with its source in brackets as the evidence writes it, such as [18-061 fig05] or [18-061 p3].
- actions: what to do. Set basis to "stated" only when the cited evidence says to do it; otherwise "inferred".
<evidence>
{evidence}
</evidence>
<question>
{question}
</question>
Return only JSON: {"match": true, "what_is_wrong": "", "findings": [{"statement": "", "source": ""}], "actions": [{"action": "", "basis": "stated or inferred", "source": ""}]}
"""

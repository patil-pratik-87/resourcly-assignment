[project]
name = "resourcly"
version = "0.1.0"
description = "Resourcly case study: a chat agent that routes each request, reads technical drawings into JSON, and evaluates both"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resourcly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/gold_tools"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "scripts/gold_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# First party even before a new module exists, as in a test written before its code
known-first-party = ["resourcly", "tests", "common", "gold_schema", "grid", "overlay"]

[tool.ruff.lint.per-file-ignores]
# The routing notebook imports as it goes
"experiments/routing/routing.py" = ["E402", "E501"]
"experiments/routing/routing.ipynb" = ["E402", "E501"]

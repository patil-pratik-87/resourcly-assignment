[project]
name = "resourcly"
version = "0.1.0"
description = "Resourcly case study: a chat agent that routes each request, reads technical drawings into JSON, and evaluates both"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pillow>=10.4",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# The vision-language readers run Qwen3-VL on Apple silicon through MLX.
vlm = [
    "mlx-vlm==0.7.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# The router's probe embeds pictures with a frozen image model (DINOv2) through PyTorch.
router = [
    "torch>=2.5",
    "transformers>=4.46",
]

[project.scripts]
resourcly = "resourcly.cli:app"
evals = "resourcly.eval_harness.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.7",
]
# Retrains the router's probe.
router-build = [
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resourcly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/gold_tools"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "scripts/gold_tools"]
# Research notebooks and scripts are exploratory and kept as they were run
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# First party even before a new module exists, as in a test written before its code
known-first-party = ["resourcly", "tests", "common", "gold_schema", "grid", "overlay", "train_route_probe"]

# The router splits name units (the `unit` field of routes.jsonl), and each unit goes wholly to
# one side: one NIST drawing with all its pages and copies, one NTSB report with its photos and
# pages, one Commons file, or one written question. A router that learns, such as a probe, trains
# on train only. The reports go one to each split. dev holds the reader's dev drawings, train four
# of the reader's test drawings, and the Commons drawings and photos go round-robin in name order.
